            title: curr.getDay() === 0 ? '100% Total Rest Day' : '4.0 Mile Zone 2 Easy Run @ 6.0 MPH + MOD-GTG-FULL',
            miles: curr.getDay() === 0 ? 0 : 4.0,
            vert: curr.getDay() === 0 ? 0 : 100,
            type: curr.getDay() === 0 ? 'Rest' : 'Easy',
            mods: curr.getDay() === 0 ? [] : ['MOD-GTG-FULL'],
            phase: 'ph2'
          };
        }

        let assignedPhase = dayData.phase;
        for (const p of INITIAL_PHASES) {
          if (dateStr >= p.start && dateStr <= p.end) {
            assignedPhase = p.id;
            break;
          }
        }

        let defaultDuration = 0;
        if (dayData.miles > 0) {
          defaultDuration = Math.round(dayData.miles * 9.5);
        } else if (dayData.title.includes('50 Mins')) defaultDuration = 50;
        else if (dayData.title.includes('55 Mins')) defaultDuration = 55;
        else if (dayData.title.includes('60 Mins')) defaultDuration = 60;
        else if (dayData.title.includes('65 Mins')) defaultDuration = 65;
        else if (dayData.title.includes('70 Mins')) defaultDuration = 70;
        else if (dayData.title.includes('75 Mins')) defaultDuration = 75;
        else if (dayData.title.includes('30 Min')) defaultDuration = 30;
        else if (dayData.title.includes('35 Min')) defaultDuration = 35;
        else if (dayData.title.includes('40 Min')) defaultDuration = 40;
        else if (dayData.title.includes('45 Min')) defaultDuration = 45;

        schedule.push({
          id: `w-${dayId++}`,
          date: dateStr,
          dayName: `${dayOfWeek}, ${monthDay}`,
          title: dayData.title,
          plannedMiles: dayData.miles,
          plannedVert: dayData.vert,
          plannedDuration: defaultDuration,
          type: dayData.type,
          modules: dayData.mods || [],
          phaseId: assignedPhase,
          completed: false,
          actualMiles: '',
          actualVert: '',
          actualDuration: '',
          notes: ''
        });

        curr.setDate(curr.getDate() + 1);
      }

      return schedule;
    }

    function App() {

        const saved = localStorage.getItem('ab_workouts_v5');

          return acc + (isNaN(dur) ? 0 : dur);
        }, 0);
      }, [workouts]);

        if (e) e.stopPropagation();

            const nextCompleted = !w.completed;
            return {

              completed: nextCompleted,
              actualMiles: nextCompleted && w.actualMiles === '' ? w.plannedMiles : w.actualMiles,
              actualVert: nextCompleted && w.actualVert === '' ? w.plannedVert : w.actualVert,
              actualDuration: nextCompleted && w.actualDuration === '' ? w.plannedDuration : w.actualDuration

      const updateWorkoutOverrides = (id, miles, vert, duration, notes) => {
        setWorkouts(prev => prev.map(w => {

            return {

              actualMiles: miles,
              actualVert: vert,

      // Calculate 7-day and 30-day rolling averages for weight logs

          const currentDate = new Date(log.date);
          
          // 7-day window
          const sevenDaysAgo = new Date(currentDate);
          sevenDaysAgo.setDate(currentDate.getDate() - 7);
          const logsIn7 = arr.filter(l => {
            const d = new Date(l.date);
            return d <= currentDate && d >= sevenDaysAgo;
          });
          const avg7 = logsIn7.length ? Number((logsIn7.reduce((acc, l) => acc + l.weight, 0) / logsIn7.length).toFixed(1)) : log.weight;

          // 30-day window
          const thirtyDaysAgo = new Date(currentDate);
          thirtyDaysAgo.setDate(currentDate.getDate() - 30);
          const logsIn30 = arr.filter(l => {
            const d = new Date(l.date);
            return d <= currentDate && d >= thirtyDaysAgo;
          });
          const avg30 = logsIn30.length ? Number((logsIn30.reduce((acc, l) => acc + l.weight, 0) / logsIn30.length).toFixed(1)) : log.weight;

          return { ...log, avg7, avg30 };

      // Weekly mileage vs weight correlation data aggregation
      const weeklyCorrelationData = useMemo(() => {

          const year = d.getFullYear();
          const onejan = new Date(year, 0, 1);

          const key = `${year}-W${String(week).padStart(2, '0')}`;
          
          const m = w.completed ? (w.actualMiles !== '' ? parseFloat(w.actualMiles) || 0 : w.plannedMiles) : w.plannedMiles;
          weeklyMiles[key] = (weeklyMiles[key] || 0) + m;

                              const rawPoints = getCoords(l => l.weight);

                      />
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="Weight (lbs)" 
                        value={newWeightVal} 
                        onChange={(e) => setNewWeightVal(e.target.value)}
                        className="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white flex-1"
                      />
                      <button type="submit" className="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-1 rounded text-xs transition-colors">
                        Log
                      </button>
                    </form>
                  </div>

                </div>

                {/* NEW REPORT SECTION: Weekly Mileage vs. Weight Correlation */}
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <div className="flex justify-between items-center mb-1">
                    <h2 className="text-lg font-bold text-white">Weekly Training Mileage vs. Weight Correlation</h2>
                    <span className="text-xs bg-gray-800 text-gray-300 border border-gray-700 px-2.5 py-0.5 rounded-full font-medium">Last 12 Training Weeks</span>
                  </div>
                  <p className="text-xs text-gray-400 mb-6">Analyze volume output alongside body weight fluctuations to ensure caloric and energy balance during peak blocks.</p>

                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                    {weeklyCorrelationData.map((item, idx) => {
                      const matchedWeight = weightLogs.slice().reverse().find(l => l.date <= item.week) || weightLogs[0];
                      return (
                        <div key={idx} className="bg-gray-800/50 border border-gray-700/60 rounded-xl p-3 flex flex-col justify-between">
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-[10px] font-mono text-gray-400 font-bold">{item.week}</span>
                            <span className="text-[10px] bg-green-950 text-green-400 px-1.5 py-0.5 rounded border border-green-800/40">{item.miles} mi</span>
                          </div>
                          <div className="text-center py-2 border-t border-gray-700/50">
                            <span className="text-[10px] text-gray-400 block uppercase">Weight Ref</span>
                            <span className="text-sm font-black text-white">{matchedWeight ? `${matchedWeight.weight} lbs` : '—'}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* BOTTOM SECTION: Phase Completion Matrix & Summary */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  
                  <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 lg:col-span-2">
                    <h2 className="text-lg font-bold text-white mb-4">Phase Completion Matrix</h2>
                    <div className="space-y-4">
                      {INITIAL_PHASES.map(ph => {
                        const phWorkouts = workouts.filter(w => w.phaseId === ph.id);
                        const phCompleted = phWorkouts.filter(w => w.completed).length;
                        const phPct = phWorkouts.length ? Math.round((phCompleted / phWorkouts.length) * 100) : 0;
                        const phMiles = phWorkouts.reduce((acc, w) => acc + w.plannedMiles, 0);

                        return (
                          <div key={ph.id} className="bg-gray-800/40 border border-gray-700/60 rounded-xl p-4">
                            <div className="flex justify-between items-center mb-2">
                              <div>
                                <h3 className="text-sm font-bold text-white">{ph.name} <span className="text-xs font-normal text-gray-400">({ph.start} to {ph.end})</span></h3>
                                <p className="text-xs text-gray-400 mt-0.5">{ph.obj}</p>
                              </div>
                              <span className="text-sm font-bold text-green-400">{phPct}%</span>
                            </div>
                            <div className="w-full bg-gray-800 rounded-full h-2.5 overflow-hidden">
                              <div className="bg-green-500 h-2.5 rounded-full transition-all duration-500" style={{ width: `${phPct}%` }}></div>
                            </div>
                            <div className="flex justify-between items-center mt-2 text-xs text-gray-400">
                              <span>Workouts Finished: {phCompleted} / {phWorkouts.length}</span>
                              <span>Target Volume: {phMiles} mi</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 flex flex-col justify-between">
                    <div>
                      <h2 className="text-lg font-bold text-white mb-2">Volume & Duration Summary</h2>
                      <p className="text-xs text-gray-400 mb-6">Aggregated totals across your 10-month master campaign.</p>

                      <div className="space-y-4">
                        <div className="bg-gray-800/60 p-4 rounded-xl border border-gray-700">
                          <span className="text-xs text-gray-400 block">Total Mileage Target</span>
                          <span className="text-xl font-black text-white">{totalPlannedMiles} Miles</span>
                          <div className="w-full bg-gray-900 rounded-full h-2 mt-2">
                            <div className="bg-green-500 h-2 rounded-full" style={{ width: `${Math.min(100, (totalActualMiles / totalPlannedMiles) * 100)}%` }}></div>
                          </div>
                        </div>

                        <div className="bg-gray-800/60 p-4 rounded-xl border border-gray-700">
                          <span className="text-xs text-gray-400 block">Total Completed Duration Tally</span>
                          <span className="text-xl font-black text-blue-400">{Math.floor(totalCompletedDurationMins / 60)} Hours {totalCompletedDurationMins % 60} Mins</span>
                          <span className="text-xs text-gray-400 mt-1 block">Tracking active running & training time</span>
                        </div>

                        <div className="bg-gray-800/60 p-4 rounded-xl border border-gray-700">
                          <span className="text-xs text-gray-400 block">Elevation Gain Target</span>
                          <span className="text-xl font-black text-white">{totalPlannedVert.toLocaleString()} Vert Ft</span>
                          <div className="w-full bg-gray-900 rounded-full h-2 mt-2">
                            <div className="bg-yellow-500 h-2 rounded-full" style={{ width: `${Math.min(100, (totalActualVert / totalPlannedVert) * 100)}%` }}></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setActiveTab('schedule')}
                      className="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-green-900/40"
                    >
                      Open Master Schedule & Logs →
                    </button>
                  </div>

                </div>

              </div>
            )}

            {/* TAB: MASTER SCHEDULE */}
            {activeTab === 'schedule' && (
              <div className="space-y-6">
                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col md:flex-row gap-4 items-center justify-between">
                  <div className="w-full md:w-auto flex flex-wrap gap-3 items-center">
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Operational Phase</label>
                      <select 
                        value={selectedPhase} 
                        onChange={(e) => setSelectedPhase(e.target.value)}
                        className="bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500"
                      >
                        <option value="all">All 7 Phases</option>
                        {INITIAL_PHASES.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Workout Type</label>
                      <select 
                        value={selectedType} 
                        onChange={(e) => setSelectedType(e.target.value)}
                        className="bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500"
                      >
                        <option value="all">All Types</option>
                        {['Easy', 'Aerobic', 'Tempo', 'Intervals', 'Incline', 'Long Trail', 'Walk', 'Rest', 'Race / Test', 'Recovery'].map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="w-full md:w-72">
                    <label className="block text-xs text-gray-400 mb-1">Search Schedule</label>
                    <input 
                      type="text" 
                      placeholder="Search workout, date, pace..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white focus:outline-none focus:border-green-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredWorkouts.map(w => {
                    const phaseObj = INITIAL_PHASES.find(p => p.id === w.phaseId);
                    const activeDur = w.actualDuration !== '' ? w.actualDuration : w.plannedDuration;
                    return (
                      <div 
                        key={w.id}
                        onClick={() => setActiveModalWorkout(w)}
                        className={`bg-gray-900 border rounded-xl p-4 flex flex-col justify-between cursor-pointer transition-all hover:border-green-500/50 hover:shadow-xl ${w.completed ? 'border-green-600/60 bg-green-950/10' : 'border-gray-800'}`}
                      >
                        <div>
                          <div className="flex justify-between items-start gap-2 mb-2">
                            <span className="text-xs font-bold text-green-400 bg-green-950/50 border border-green-800/40 px-2 py-0.5 rounded">{w.dayName} ({w.date})</span>
                            <div className="flex items-center gap-2">
                              <span className="text-[10px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded">{w.type}</span>
                              <button 
                                onClick={(e) => toggleComplete(w.id, e)}
                                className={`w-6 h-6 rounded-full flex items-center justify-center border transition-colors ${w.completed ? 'bg-green-600 border-green-500 text-white' : 'border-gray-700 bg-gray-800 text-transparent hover:border-green-500'}`}
                              >
                                ✓
                              </button>
                            </div>
                          </div>

                          <p className="text-sm font-medium text-gray-200 line-clamp-3 mb-3">{w.title}</p>
                        </div>

                        <div className="border-t border-gray-800 pt-3 mt-2 flex flex-col gap-2 text-xs text-gray-400">
                          <div className="flex justify-between items-center">
                            <span>Phase: <strong className="text-gray-300">{phaseObj ? phaseObj.name : ''}</strong></span>
                            <div className="flex gap-2">
                              {w.plannedMiles > 0 && (
                                <span className={w.actualMiles !== '' ? 'text-green-400 font-bold' : ''}>
                                  {w.actualMiles !== '' ? `${w.actualMiles} mi` : `${w.plannedMiles} mi`}
                                </span>
                              )}
                              {activeDur > 0 && (
                                <span className="text-blue-400 font-bold">
                                  {activeDur}m
                                </span>
                              )}
                            </div>
                          </div>

                          {w.modules.length > 0 && (
                            <div className="flex flex-wrap gap-1 mt-1">
                              {w.modules.map(m => (
                                <span key={m} className="bg-gray-800 text-gray-300 text-[10px] px-1.5 py-0.5 rounded border border-gray-700">{m}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: ROUTINE MODULES */}
            {activeTab === 'modules' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <h2 className="text-xl font-black text-white mb-2">Standardized Routine Modules</h2>
                  <p className="text-sm text-gray-400 mb-6">Building blocks referenced across your daily schedule for core stability, posture, and recovery.</p>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {INITIAL_MODULES.map(m => (
                      <div key={m.code} className="bg-gray-800/60 border border-gray-700 rounded-xl p-5 flex flex-col justify-between">
                        <div>
                          <span className="text-xs font-bold text-green-400 bg-green-950/60 px-2.5 py-1 rounded border border-green-800/50">{m.code}</span>
                          <h3 className="text-base font-bold text-white mt-3">{m.name}</h3>
                          <p className="text-xs text-gray-300 mt-2 bg-gray-900/60 p-3 rounded-lg border border-gray-700/50 whitespace-pre-line">{m.comp}</p>
                        </div>
                        <div className="border-t border-gray-700/60 pt-3 mt-4 text-xs text-gray-400">
                          <strong>Purpose:</strong> {m.purpose}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: EXERCISE CATALOG */}
            {activeTab === 'exercises' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <h2 className="text-xl font-black text-white mb-2">Exercise Catalog & Dictionary</h2>
                  <p className="text-sm text-gray-400 mb-6">Precise execution standards for strength, core, and incline power-hiking.</p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {INITIAL_EXERCISES.map((ex, idx) => (
                      <div key={idx} className="bg-gray-800/60 border border-gray-700 rounded-xl p-4">
                        <h3 className="text-sm font-bold text-green-400 mb-1">{ex.name}</h3>
                        <p className="text-xs text-gray-300">{ex.def}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: INGEST & UPDATE PLAN */}
            {activeTab === 'ingest' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-3xl mx-auto">
                  <h2 className="text-xl font-black text-white mb-2">Ingest & Update Master Plan</h2>
                  <p className="text-sm text-gray-400 mb-6">Paste revised blueprint schedule text below. Your completed workouts, checkmarks, and overrides are fully preserved in local storage.</p>

                  <textarea 
                    rows="8"
                    placeholder="Paste updated blueprint schedule text here..."
                    value={ingestText}
                    onChange={(e) => setIngestText(e.target.value)}
                    className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-green-500 mb-4 font-mono"
                  ></textarea>

                  <div className="flex gap-4">
                    <button 
                      onClick={handlePreviewIngest}
                      className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm border border-gray-700 transition-colors"
                    >
                      1. Preview Changes
                    </button>
                    <button 
                      onClick={handleApplyIngest}
                      className="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg shadow-green-900/40 transition-colors"
                    >
                      2. Apply Plan Updates
                    </button>
                  </div>

                  {ingestPreview && (
                    <div className="mt-6 bg-gray-800/60 border border-gray-700 rounded-xl p-4">
                      <h3 className="text-sm font-bold text-white mb-2">Preview Detected Sections ({ingestPreview.length} items)</h3>
                      <div className="space-y-1 max-h-48 overflow-y-auto text-xs text-gray-300 font-mono">
                        {ingestPreview.map((item, i) => (
                          <div key={i} className="bg-gray-900 p-2 rounded border border-gray-800">{item.raw}</div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* WORKOUT DETAIL & OVERRIDE MODAL */}
          {activeModalWorkout && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs font-bold text-green-400 bg-green-950/60 px-2.5 py-1 rounded border border-green-800/50">{activeModalWorkout.dayName} ({activeModalWorkout.date})</span>
                    <h3 className="text-lg font-black text-white mt-2">{activeModalWorkout.title}</h3>
                  </div>
                  <button 
                    onClick={() => setActiveModalWorkout(null)}
                    className="text-gray-400 hover:text-white text-xl font-bold bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-gray-800/60 border border-gray-700 rounded-xl p-4 space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-green-400">Planned Targets</h4>
                  <div className="grid grid-cols-3 gap-2 text-xs text-gray-300">
                    <div>Distance: <strong className="text-white">{activeModalWorkout.plannedMiles} mi</strong></div>
                    <div>Duration: <strong className="text-white">{activeModalWorkout.plannedDuration} min</strong></div>
                    <div>Vert Gain: <strong className="text-white">{activeModalWorkout.plannedVert} ft</strong></div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-white">Log Actual Telemetry & Duration</h4>
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Distance (mi)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        defaultValue={activeModalWorkout.actualMiles !== '' ? activeModalWorkout.actualMiles : activeModalWorkout.plannedMiles}
                        id="modal-actual-miles"
                        className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Duration (min)</label>
                      <input 
                        type="number" 
                        defaultValue={activeModalWorkout.actualDuration !== '' ? activeModalWorkout.actualDuration : activeModalWorkout.plannedDuration}
                        id="modal-actual-duration"
                        className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Vert (ft)</label>
                      <input 
                        type="number" 
                        defaultValue={activeModalWorkout.actualVert !== '' ? activeModalWorkout.actualVert : activeModalWorkout.plannedVert}
                        id="modal-actual-vert"
                        className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Workout Notes & Execution Feedback</label>
                    <textarea 
                      defaultValue={activeModalWorkout.notes}
                      id="modal-notes"
                      rows="3"
                      placeholder="How did the run or workout feel? Heart rate, fueling, weather..."
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-green-500"
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-2">
                  <button 
                    onClick={() => setActiveModalWorkout(null)}
                    className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-xs"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      const miles = document.getElementById('modal-actual-miles').value;
                      const duration = document.getElementById('modal-actual-duration').value;
                      const vert = document.getElementById('modal-actual-vert').value;
                      const notes = document.getElementById('modal-notes').value;
                      updateWorkoutOverrides(activeModalWorkout.id, miles, vert, duration, notes);
                      setActiveModalWorkout(null);
                    }}
                    className="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow-lg shadow-green-900/40"
                  >
                    Save & Complete Workout
                  </button>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-gray-900 border-t border-gray-800 py-6 px-4 text-center text-xs text-gray-500">
            Master Athletic Blueprint (V2) • USSF HPA & Colorado Mountain Ultra Series (Nov 16, 2026 – Sep 28, 2027)
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
