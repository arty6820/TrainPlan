            title: curr.getDay() === 0 ? '100% Total Rest Day' : '4.0 Mile Zone 2 Easy Run @ 6.0 MPH + MOD-GTG-FULL',
            miles: curr.getDay() === 0 ? 0 : 4.0,
            vert: curr.getDay() === 0 ? 0 : 100,
            type: curr.getDay() === 0 ? 'Rest' : 'Easy',
            mods: curr.getDay() === 0 ? [] : ['MOD-GTG-FULL'],
            phase: 'ph2'
          };
        }

        let assignedPhase = dayData.phase;
        for (const p of INITIAL_PHASES) {
          if (dateStr >= p.start && dateStr <= p.end) {
            assignedPhase = p.id;
            break;
          }
        }

        let defaultDuration = 0;
        if (dayData.miles > 0) {
          defaultDuration = Math.round(dayData.miles * 9.5);
        } else if (dayData.title.includes('50 Mins')) defaultDuration = 50;
        else if (dayData.title.includes('55 Mins')) defaultDuration = 55;
        else if (dayData.title.includes('60 Mins')) defaultDuration = 60;
        else if (dayData.title.includes('65 Mins')) defaultDuration = 65;
        else if (dayData.title.includes('70 Mins')) defaultDuration = 70;
        else if (dayData.title.includes('75 Mins')) defaultDuration = 75;
        else if (dayData.title.includes('30 Min')) defaultDuration = 30;
        else if (dayData.title.includes('35 Min')) defaultDuration = 35;
        else if (dayData.title.includes('40 Min')) defaultDuration = 40;
        else if (dayData.title.includes('45 Min')) defaultDuration = 45;

        schedule.push({
          id: `w-${dayId++}`,
          date: dateStr,
          dayName: `${dayOfWeek}, ${monthDay}`,
          title: dayData.title,
          plannedMiles: dayData.miles,
          plannedVert: dayData.vert,
          plannedDuration: defaultDuration,
          type: dayData.type,
          modules: dayData.mods || [],
          phaseId: assignedPhase,
          completed: false,
          skipped: false,
          actualMiles: '',
          actualVert: '',
          actualDuration: '',
          notes: ''
        });

        curr.setDate(curr.getDate() + 1);
      }

      return schedule;
    }

                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Target Carbohydrates/Calories (kcal/hr)</label>
                      <input type="number" value={calcKcalRate} onChange={(e) => setCalcKcalRate(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white" />
                    </div>
                  </div>

                  <div className="bg-gray-800/60 border border-gray-700 rounded-xl p-4 mb-6">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-green-400 mb-3">Whole Food Hourly Breakdown (Per Hour @ {calcKcalRate} kcal)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
                      <div className="bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <span className="text-gray-400 block font-medium">🥔 Boiled Potatoes (Salted)</span>
                        <strong className="text-white text-sm">~3-4 bite-sized pieces</strong>
                        <span className="text-[10px] text-gray-500 block mt-1">Easy sodium & complex carbs</span>
                      </div>
                      <div className="bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <span className="text-gray-400 block font-medium">🍚 Honey Rice Cakes</span>
                        <strong className="text-white text-sm">2 dense squares</strong>
                        <span className="text-[10px] text-gray-500 block mt-1">Rapid-digesting clean carbs</span>
                      </div>
                      <div className="bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <span className="text-gray-400 block font-medium">🥪 Turkey & Cheese Wrap Bites</span>
                        <strong className="text-white text-sm">2 pinwheel slices</strong>
                        <span className="text-[10px] text-gray-500 block mt-1">Savory protein/fat balance</span>
                      </div>
                      <div className="bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <span className="text-gray-400 block font-medium">💧 Liquid Drink Mix / Water</span>
                        <strong className="text-white text-sm">18–24 oz + 1 Salt Capsule</strong>
                        <span className="text-[10px] text-gray-500 block mt-1">Electrolyte & fluid balance</span>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-3 mb-6">
                    <h3 className="text-sm font-bold text-white">Saved Real-Food Protocols & Drop Bag Plans</h3>
                    {realFoodPlans.length === 0 ? (
                      <p className="text-xs text-gray-500 italic">No custom real-food fueling plans saved yet.</p>
                    ) : (
                      realFoodPlans.map(rf => (
                        <div key={rf.id} className="bg-gray-800/60 border border-gray-700 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-green-400 font-mono">{rf.date}</span>
                              <span className="text-sm font-bold text-white">— {rf.session}</span>
                            </div>
                            <p className="text-xs text-gray-300 mt-1">{rf.notes}</p>
                          </div>
                          <button onClick={() => setRealFoodPlans(prev => prev.filter(p => p.id !== rf.id))} className="text-xs text-red-400 hover:text-red-300 bg-red-950/40 border border-red-900 px-2 py-1 rounded">Delete</button>
                        </div>
                      ))
                    )}
                  </div>

                  <form onSubmit={handleAddRealFoodPlan} className="bg-gray-800/80 p-4 rounded-xl border border-gray-700 space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <input type="date" value={newRfDate} onChange={(e) => setNewRfDate(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white" />
                      <input type="text" placeholder="Race / Long Run Name (e.g. Spring 100K Drop Bag Plan)..." value={newRfSession} onChange={(e) => setNewRfSession(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white" />
                    </div>
                    <textarea rows="2" placeholder="Describe your real-food strategy (e.g., potatoes at Aid Station 2, rice cakes every hour, electrolyte mix)..." value={newRfNotes} onChange={(e) => setNewRfNotes(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white"></textarea>
                    <button type="submit" className="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded text-xs transition-colors">Save Real-Food Plan</button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB: RECOVERY & TELEMETRY */}
            {activeTab === 'recovery' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <h2 className="text-xl font-black text-white mb-1">Recovery Telemetry & Wearable Sync</h2>
                  <p className="text-xs text-gray-400 mb-6">Track HRV, Resting Heart Rate (RHR), and Sleep Score to detect central nervous system fatigue during peak blocks.</p>

                  <div className="space-y-3 mb-6">
                    {recoveryLogs.length === 0 ? (
                      <p className="text-xs text-gray-500 italic">No daily recovery logs recorded yet. Add your wearable telemetry below.</p>
                    ) : (
                      recoveryLogs.map(rec => (
                        <div key={rec.id} className="bg-gray-800/60 border border-gray-700 rounded-xl p-4 flex justify-between items-center">
                          <span className="text-xs font-bold text-green-400 font-mono">{rec.date}</span>
                          <div className="flex gap-4 text-xs font-mono">
                            <span className="bg-gray-900 px-3 py-1 rounded border border-gray-700">💤 Sleep: <strong className="text-white">{rec.sleep}%</strong></span>
                            <span className="bg-gray-900 px-3 py-1 rounded border border-gray-700">❤️ RHR: <strong className="text-white">{rec.rhr} bpm</strong></span>
                            <span className="bg-gray-900 px-3 py-1 rounded border border-gray-700">📈 HRV: <strong className="text-white">{rec.hrv} ms</strong></span>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <form onSubmit={handleAddRecovery} className="bg-gray-800/80 p-4 rounded-xl border border-gray-700 flex flex-col sm:flex-row gap-3 items-center">
                    <input type="date" value={newRecDate} onChange={(e) => setNewRecDate(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white w-full sm:w-auto" />
                    <input type="number" placeholder="HRV (ms)" value={newRecHrv} onChange={(e) => setNewRecHrv(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white flex-1 w-full" />
                    <input type="number" placeholder="RHR (bpm)" value={newRecRhr} onChange={(e) => setNewRecRhr(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white flex-1 w-full" />
                    <input type="number" placeholder="Sleep Score (%)" value={newRecSleep} onChange={(e) => setNewRecSleep(e.target.value)} className="bg-gray-900 border border-gray-700 rounded px-3 py-2 text-xs text-white flex-1 w-full" />
                    <button type="submit" className="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded text-xs transition-colors w-full sm:w-auto">Log Metrics</button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB: ROUTINE MODULES */}
            {activeTab === 'modules' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <h2 className="text-xl font-black text-white mb-2">Standardized Routine Modules</h2>
                  <p className="text-sm text-gray-400 mb-6">Building blocks referenced across your daily schedule for core stability, posture, and recovery.</p>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {INITIAL_MODULES.map(m => (
                      <div key={m.code} className="bg-gray-800/60 border border-gray-700 rounded-xl p-5 flex flex-col justify-between">
                        <div>
                          <span className="text-xs font-bold text-green-400 bg-green-950/60 px-2.5 py-1 rounded border border-green-800/50">{m.code}</span>
                          <h3 className="text-base font-bold text-white mt-3">{m.name}</h3>
                          <p className="text-xs text-gray-300 mt-2 bg-gray-900/60 p-3 rounded-lg border border-gray-700/50 whitespace-pre-line">{m.comp}</p>
                        </div>
                        <div className="border-t border-gray-700/60 pt-3 mt-4 text-xs text-gray-400">
                          <strong>Purpose:</strong> {m.purpose}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: EXERCISE CATALOG */}
            {activeTab === 'exercises' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                  <h2 className="text-xl font-black text-white mb-2">Exercise Catalog & Dictionary</h2>
                  <p className="text-sm text-gray-400 mb-6">Precise execution standards for strength, core, and incline power-hiking.</p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {INITIAL_EXERCISES.map((ex, idx) => (
                      <div key={idx} className="bg-gray-800/60 border border-gray-700 rounded-xl p-4">
                        <h3 className="text-sm font-bold text-green-400 mb-1">{ex.name}</h3>
                        <p className="text-xs text-gray-300">{ex.def}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: INGEST & UPDATE PLAN */}
            {activeTab === 'ingest' && (
              <div className="space-y-6">
                <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-3xl mx-auto">
                  <h2 className="text-xl font-black text-white mb-2">Ingest & Update Master Plan</h2>
                  <p className="text-sm text-gray-400 mb-6">Paste revised blueprint schedule text below. Your completed workouts, checkmarks, and overrides are fully preserved in local storage.</p>

                  <textarea rows="8" placeholder="Paste updated blueprint schedule text here..." value={ingestText} onChange={(e) => setIngestText(e.target.value)} className="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-green-500 mb-4 font-mono"></textarea>

                  <div className="flex gap-4">
                    <button onClick={handlePreviewIngest} className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm border border-gray-700 transition-colors">1. Preview Changes</button>
                    <button onClick={handleApplyIngest} className="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg shadow-green-900/40 transition-colors">2. Apply Plan Updates</button>
                  </div>

                  {ingestPreview && (
                    <div className="mt-6 bg-gray-800/60 border border-gray-700 rounded-xl p-4">
                      <h3 className="text-sm font-bold text-white mb-2">Preview Detected Sections ({ingestPreview.length} items)</h3>
                      <div className="space-y-1 max-h-48 overflow-y-auto text-xs text-gray-300 font-mono">
                        {ingestPreview.map((item, i) => (<div key={i} className="bg-gray-900 p-2 rounded border border-gray-800">{item.raw}</div>))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* EDIT SHOE MODAL */}
          {editingShoe && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-6 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-black text-white">Edit Footwear Parameters</h3>
                  <button onClick={() => setEditingShoe(null)} className="text-gray-400 hover:text-white text-xl font-bold bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                </div>

                <form onSubmit={handleSaveEditedShoe} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Shoe Model Name</label>
                    <input 
                      type="text" 
                      value={editingShoe.name} 
                      onChange={(e) => setEditingShoe({ ...editingShoe, name: e.target.value })} 
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Cumulative Mileage (mi)</label>
                    <input 
                      type="number" 
                      step="0.1" 
                      value={editingShoe.manualMiles} 
                      onChange={(e) => setEditingShoe({ ...editingShoe, manualMiles: parseFloat(e.target.value) || 0 })} 
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white" 
                      required 
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Max Threshold Mileage (mi)</label>
                    <input 
                      type="number" 
                      value={editingShoe.maxMiles} 
                      onChange={(e) => setEditingShoe({ ...editingShoe, maxMiles: parseFloat(e.target.value) || 350 })} 
                      className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white" 
                      required 
                    />
                  </div>

                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setEditingShoe(null)} className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-xs">Cancel</button>
                    <button type="submit" className="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow-lg shadow-green-900/40">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* WORKOUT DETAIL & OVERRIDE MODAL */}
          {activeModalWorkout && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-2xl">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs font-bold text-green-400 bg-green-950/60 px-2.5 py-1 rounded border border-green-800/50">{activeModalWorkout.dayName} ({activeModalWorkout.date})</span>
                    <h3 className="text-lg font-black text-white mt-2">{activeModalWorkout.title}</h3>
                  </div>
                  <button onClick={() => setActiveModalWorkout(null)} className="text-gray-400 hover:text-white text-xl font-bold bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                </div>

                <div className="bg-gray-800/60 border border-gray-700 rounded-xl p-4 space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-green-400">Planned Targets</h4>
                  <div className="grid grid-cols-3 gap-2 text-xs text-gray-300">
                    <div>Distance: <strong className="text-white">{activeModalWorkout.plannedMiles} mi</strong></div>
                    <div>Duration: <strong className="text-white">{activeModalWorkout.plannedDuration} min</strong></div>
                    <div>Vert Gain: <strong className="text-white">{activeModalWorkout.plannedVert} ft</strong></div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-white">Log Actual Telemetry & Duration</h4>
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Distance (mi)</label>
                      <input type="number" step="0.1" defaultValue={activeModalWorkout.actualMiles !== '' ? activeModalWorkout.actualMiles : activeModalWorkout.plannedMiles} id="modal-actual-miles" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500" />
                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Duration (min)</label>
                      <input type="number" defaultValue={activeModalWorkout.actualDuration !== '' ? activeModalWorkout.actualDuration : activeModalWorkout.plannedDuration} id="modal-actual-duration" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500" />
                    </div>
                    <div>
                      <label className="block text-xs text-gray-400 mb-1">Vert (ft)</label>
                      <input type="number" defaultValue={activeModalWorkout.actualVert !== '' ? activeModalWorkout.actualVert : activeModalWorkout.plannedVert} id="modal-actual-vert" className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-green-500" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 mb-1">Workout Notes & Execution Feedback</label>
                    <textarea defaultValue={activeModalWorkout.notes} id="modal-notes" rows="3" placeholder="How did the run or workout feel? Heart rate, fueling, weather..." className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-green-500"></textarea>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button onClick={() => { toggleSkip(activeModalWorkout.id); setActiveModalWorkout(null); }} className="bg-amber-950/60 hover:bg-amber-900/60 text-amber-400 border border-amber-800/50 font-bold px-4 py-2 rounded-xl text-xs">
                    {activeModalWorkout.skipped ? 'Unmark Skipped' : 'Mark as Skipped'}
                  </button>

                  <div className="flex gap-3">
                    <button onClick={() => setActiveModalWorkout(null)} className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-xs">Cancel</button>
                    <button onClick={() => {
                      const miles = document.getElementById('modal-actual-miles').value;
                      const duration = document.getElementById('modal-actual-duration').value;
                      const vert = document.getElementById('modal-actual-vert').value;
                      const notes = document.getElementById('modal-notes').value;
                      updateWorkoutOverrides(activeModalWorkout.id, miles, vert, duration, notes);
                      setActiveModalWorkout(null);
                    }} className="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow-lg shadow-green-900/40">Save & Complete Workout</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-gray-900 border-t border-gray-800 py-6 px-4 text-center text-xs text-gray-500">
            Master Athletic Blueprint (V2) • USSF HPA & Colorado Mountain Ultra Series (Nov 16, 2026 – Sep 28, 2027)
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
